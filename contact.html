<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABC Corrugated Boxes - Contact Us</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">ABC Boxes</div>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="clients.html">Clients</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <h1 class="section-title reveal">Contact Us</h1>
      <div class="contact-content">
        <form class="contact-form reveal">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your Name" required>

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Your Email" required>

          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Your Message" required></textarea>

          <button type="submit" class="btn">Send Message</button>
        </form>
        <div class="contact-info reveal">
          <h2>Get in Touch</h2>
          <p><strong>Address:</strong> 123 Packaging Lane, Box City, Country</p>
          <p><strong>Phone:</strong> +1 (123) 456-7890</p>
          <p><strong>Email:</strong> info@abccorrugated.com</p>
          <p><strong>Working Hours:</strong> Mon-Fri 9am - 5pm</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2025 ABC Corrugated Boxes. All rights reserved.</p>
  </footer>
</body>
</html>
