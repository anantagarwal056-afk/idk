<!DOCTYPE html>
<html lang="en">

  <header>

      <div class="logo">ABC Boxes</div>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span class="hamburger"></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="clients.html" class="active">Clients</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="clients-section">
      <h1 class="section-title reveal">Our Clients</h1>
      <div class="clients-grid">
        <div class="client-logo reveal">
          <img src="https://via.placeholder.com/150?text=Client+1" alt="Client 1">

        <div class="client-logo reveal">
          <img src="https://via.placeholder.com/150?text=Client+2" alt="Client 2">

          <img src="https://via.placeholder.com/150?text=Client+4" alt="Client 4">

        <div class="client-logo reveal">
          <img src="https://via.placeholder.com/150?text=Client+6" alt="Client 6">
        </div>
      </div>
      <section class="sectors">
        <h2 class="section-title reveal">Sectors We Serve</h2>
        <ul class="sector-list reveal">
          <li>Food &amp; Beverage</li>
          <li>Electronics</li>
          <li>Pharmaceuticals</li>
          <li>Retail &amp; E-commerce</li>
          <li>Automotive</li>
